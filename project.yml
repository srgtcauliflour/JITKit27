name: JITKit27
options:
  bundleIdPrefix: com.srgtcauliflour
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  JITKit27:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: JITKit27FFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srgtcauliflour.jitkit27
        INFOPLIST_FILE: ios-app/Info.plist
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
