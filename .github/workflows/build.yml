name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen rustup-init
      - name: Rust toolchain
        run: |
          rustup-init -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer || true
          xcodebuild -version
      - name: Build Rust core
        run: ./build-rust.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project JITKit27.xcodeproj -scheme JITKit27 -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
